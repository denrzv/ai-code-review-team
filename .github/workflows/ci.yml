name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B verify
      - name: Check packaged application health
        timeout-minutes: 2
        shell: bash
        run: |
          log_file=$(mktemp)
          java -jar target/ai-code-review-team-0.1.0-SNAPSHOT.jar --server.port=18080 > "$log_file" 2>&1 &
          app_pid=$!
          cleanup() {
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
            rm -f "$log_file"
          }
          trap cleanup EXIT
          for ((attempt = 1; attempt <= 20; attempt++)); do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              break
            fi
            if curl --fail --silent --max-time 1 http://127.0.0.1:18080/actuator/health |
                jq -e '.status == "UP"' > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$log_file" >&2
          exit 1
